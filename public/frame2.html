<script src="bundle.js"></script>

<script>
    function redirectToExam(course, category, fileName) {
        // Call the createFileRef function to get the reference
        getFileDownloadURL(course, category, fileName)
            .then((downloadURL) => {
                // If the reference exists, open it in a new tab
                if (downloadURL) {
                    window.open(downloadURL);
                } else {
                    console.log("File does not exist");
                }
            })
            .catch((error) => {
                console.error("Error:", error);
            });
    }

    function createFoldersTest() {
        storageCreateCourse('testCourse');
    }
</script>

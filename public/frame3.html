<!DOCTYPE html>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<html>
<head>
<title>Login</title>
</head>
<style>
    h1, p {
        text-align: center;
    }
    form  {
        display: table;
        margin-left: auto;
        margin-right: auto;
    }
    label {
        display: table-row;
    }
    input {
        display: table-row;
        padding: 6px 20px;
        margin: 2px;
        box-sizing: border-box;
    }
    .btn {
        padding: 5px;
        font-size: 20px;
    }
    nav {
        text-align: center;
    }
    p {
        font-size:x-large;
    }
    
</style>
<body>
<button class="btn" onclick="location.href='index.html';"><i class="fa fa-home"></i></button>

<h1>Campus Connect</h1>
<p>Log in using a google account.</p>

<nav>
    <button id="googleSignInButton">Google login</button>
    <button id="googleSignOutButton">Google sign out</button>
</nav>
<p id='login_info' style='display: block'>You're logged in</p>   

<script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-auth.js"></script>
<script>
    var firebaseConfig = {
        apiKey: "AIzaSyAjWnGy2HpTFM-07fRp3VIokULmU_dyMg4",
        authDomain: "campusconnect-30c4a.firebaseapp.com",
        databaseURL: "https://campusconnect-30c4a-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "campusconnect-30c4a",
        storageBucket: "campusconnect-30c4a.appspot.com",
        messagingSenderId: "728123265116",
        appId: "1:728123265116:web:2d24f83a222e156fe4d699",
        measurementId: "G-YRMP4KDMNX"
    };
    firebase.initializeApp(firebaseConfig);
</script>
  
<script>

    function signInWithGoogle() {
      var provider = new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(provider).then(function(result) {
        var user = result.user;
        console.log("Signed in", user)
      }).catch(function(error) {
        console.error(error);
      });
    }

    function signOutWithGoogle() {
    firebase.auth().signOut().then(() => {
        console.log("Signed out");
    }).catch((error) => {
        console.error(error);
    });
    }

    document.getElementById('googleSignInButton').addEventListener('click', signInWithGoogle);
    document.getElementById('googleSignOutButton').addEventListener('click', signOutWithGoogle);

    firebase.auth().onAuthStateChanged((user) => {
    if(user) {
        console.log("User is signed in");
    } else {
        console.log("User is signed out");
    }
    })
</script>

</body>
</html>

  <script>
    $(document).ready(function() {
    // Add click event listener to the "Add Quiz" button
    $('#add-quiz-btn').click(function() {
        var myVariable = localStorage.getItem("myVariable");
        var errorMessageAdd = document.getElementById("error-message-add");
        console.log(myVariable);
        if(myVariable === "true") {
            errorMessageAdd.style.display = "none";
            $('#addQuizModal').modal('show');
            $('#quiz-name').show();
            $('#submit-name-btn').show();
            $('#questions-container').hide(); 
        } else {
            errorMessageAdd.style.display = "block";
            errorMessageAdd.textContent = "Need to sign in to add quiz questions.";
        }
        
    });
    
    // Add click event listener to the "Submit Name" button
    $('#submit-name-btn').click(function() {
      createQuiz();
    });
    
    // Add click event listener to the "Add a Question" button
    $('#add-question-btn').click(function() {
      if ($('.question-inputs').length === 0) {
        var questionInputs = $($('#question-template').html());

        $('#questions-container').append(questionInputs);
        
        // Hide the "Add a Question" button after adding a question
        $(this).hide(); 
      }
    });
    
    // Add click event listener to the "Save Quiz" button
    $('#save-quiz-btn').click(function() {
      $('#addQuizModal').modal('hide');
    });
    });
  </script>

    <script>
          function createoncefunction() {
            let hasbeencalled = false;
            return function () {
                if (!hasbeencalled) {
                    signOutWithGoogle();
                    var myVariable = "false";
                    localStorage.setItem("myVariable", myVariable);
                    hasbeencalled = true;
                }
            }
        }

        const state = createoncefunction();

        function set_name() {
            var status = localStorage.getItem("myVariable");
            if (status === "false") {
                document.getElementById("login_status").innerHTML = "Login"
            }
            else {
                document.getElementById("login_status").innerHTML = "Logout"
            }

        }

        function google_event() {
            var status = localStorage.getItem("myVariable");
            if (status === "false") {
                event_login();

            }
            else {
                event_logout();

            }
        }

        function event_login() {
            signInWithGoogle();
            return;
        }

        function event_logout() {
            change();
            signOutWithGoogle();
            return;
        }

        function change() {
            var myVariable = localStorage.getItem("myVariable");
            if (myVariable === "false") {
                myVariable = "true";
            }
            else {
                myVariable = "false";
            }
            localStorage.setItem("myVariable", myVariable);
        }

        function disableLoginButton() {
            var btn = document.getElementById('login_status');
            btn.onclick = function(event) {
                event.preventDefault();
            }
            btn.innerHTML = "Waiting for response...";
        }

        function enableLoginButton() {
            var btn = document.getElementById('login_status');
            btn.setAttribute("href", "#");
            btn.onclick = google_event;
            btn.innerHTML = "Login";
        }

        function signInWithGoogle() {
            var provider = new firebase.auth.GoogleAuthProvider();
            
            disableLoginButton();
            
            firebase.auth().signInWithPopup(provider).then(function (result) {
                var user = result.user;
                console.log("Signed in", user);
                enableLoginButton();
                document.getElementById("login_status").innerHTML = "Logout";
                change();

            }).catch(function (error) {
                console.error(error);
                enableLoginButton();
                
                document.getElementById("login_status").innerHTML = "Login";
            });
        }

        function signOutWithGoogle() {
            firebase.auth().signOut().then(() => {
                console.log("Signed out");
                document.getElementById("login_status").innerHTML = "Login"
            }).catch((error) => {
                console.error(error);
            });
        }

        //document.getElementById('googleSignInButton').addEventListener('click', event_login);

        //document.getElementById('googleSignOutButton').addEventListener('click', event_logout);

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                console.log("User is signed in");
            } else {
                console.log("User is signed out");
            }
        })

        getAllQuizzes();
    </script>

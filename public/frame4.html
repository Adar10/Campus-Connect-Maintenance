<style>
h1, h2 {
    text-align: center;
}

    font-size: 20px;
}
form  {
    display: table;
    margin-left: auto;

}

    display: table-row;
}

    display: table-row;

}

    padding: 5px;
    width: 40px;
    font-size: 20px;
}

<body>
<script type="module" src="frame2.html"></script>

<script>
    var myVariable = localStorage.getItem("myVariable");
    console.log(myVariable); // Output: "Hello from first HTML file!"

    onload=()=> {
    if (myVariable==="true") {
        document.getElementById('pdf-file').disabled = false;  
        document.getElementById('msg').style.display = "none";
    }
    else {
    }
    }
    
    
    
</script>
<button class="btn"  onclick="location.href='root.html';"><i class="fa fa-home"></i></button>
<h1>Campus Connect</h1>
<h2>Upload material to our database</h2>

<form>
    <p id="msg" style="display: block;">You must be logged in to upload</p>
    <input type="file" id="pdf-file" name="ffile" accept="application/pdf, image/jpeg, image/png, video/*" disabled="true"><br>
    <label for="fname">Name of file:</label>
    <input type="text" id="fname" name="fname"><br><br>
    <input type="submit" value="Submit">
</form>

<button onclick="location.href='frame3.html';">Login</button>

</html>
